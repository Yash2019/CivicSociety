services:
  - type: web
    name: civic-society-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        fromDatabase:
          name: civic-society-db
          property: connectionString
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: civic-society-db
    databaseName: civic_society
    user: civic_admin
    plan: free
